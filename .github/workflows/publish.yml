name: Optional Publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    name: Publishing Disabled

    runs-on: ubuntu-latest

    steps:
      - name: Explain disabled publish flow
        shell: bash
        run: |
          {
            echo "Automatic Winget publishing is disabled for this fork."
            echo "The Windows release workflow now stops at creating the draft GitHub release and attaching the installer."
          } >> "$GITHUB_STEP_SUMMARY"
